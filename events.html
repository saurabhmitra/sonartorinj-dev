<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar Tori - Events</title>
    <link rel="stylesheet" href="styles.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="images/logo.jpg" alt="Sonar Tori Logo" class="logo-img">
                    <h1>Sonar Tori</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="tickets.html">Tickets</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="events-section">
            <div class="container">
                <h2 class="page-title">Upcoming Events</h2>
                <p class="no-events-message">Check back soon for upcoming events!</p>
            </div>
        </section>

        <section class="past-events-section">
            <div class="container">
                <h2 class="page-title">Past Events</h2>
                
                <div class="past-event-card">
                    <h3>Saraswati Puja and Sankranti 2026</h3>
                    <p class="past-event-date">January 19, 2026 • Princeton Italian American Club</p>
                    <div class="carousel-container">
                        <button class="carousel-btn carousel-btn-prev" aria-label="Previous image">‹</button>
                        <div class="carousel-track">
                            <img src="images/saraswati_puja.jpg" alt="Saraswati Puja and Sankranti 2026" class="carousel-slide active">
                            <img src="images/prasad.jpg" alt="Prasad" class="carousel-slide">
                            <img src="images/lunch.jpeg" alt="Lunch" class="carousel-slide">
                            <img src="images/dinner.jpg" alt="Dinner" class="carousel-slide">
                            <img src="images/chai.jpg" alt="Tea and Snacks" class="carousel-slide">
                        </div>
                        <button class="carousel-btn carousel-btn-next" aria-label="Next image">›</button>
                    </div>
                    <div class="carousel-dots"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Sonar Tori. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
